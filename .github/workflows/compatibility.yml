name: Browser compatibility probe

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: jam-status-browser-compatibility
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - run: npm ci
      - name: Probe validators with ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_PATH: ${{ matrix.browser == 'firefox' && steps.firefox.outputs.firefox-path || '/usr/bin/google-chrome' }}
        run: npm run probe -- --output "probe-output/${BROWSER}.json" --retries 3 --retry-delay-ms 6500 --require-operational
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.browser }}
          path: probe-output/${{ matrix.browser }}.json
          if-no-files-found: error
